<!doctype html>
<html lang="en">
<head>

<title>Lantern Noodle Night — a night-market noodle stall game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #17102e; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Lantern Noodle Night: run a night-market noodle stall. Boil noodles, chop greens, grill chicken, plate dishes to order and serve them before the tickets run out."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
